const KEY = 'roomPick.v1';
const st = JSON.parse(localStorage.getItem(KEY) || '{"r":{},"log":[]}');
const save = () => localStorage.setItem(KEY, JSON.stringify(st));
const G = D.groups; const ids = Object.keys(G);
const R = id => (st.r[id] || {r: 1500, n: 0});
function elo(w, l, k){ const a = R(w), b = R(l); const ea = 1 / (1 + Math.pow(10, (b.r - a.r) / 400)); a.r += k * (1 - ea); b.r -= k * (1 - ea); a.n++; b.n++; st.r[w] = a; st.r[l] = b; }
function down(id, k){ const a = R(id); const ea = 1 / (1 + Math.pow(10, (1500 - a.r) / 400)); a.r -= k * ea; a.n++; st.r[id] = a; }
let cur = null;
function pickPair(){
  const recent = new Set(st.log.slice(-6).flatMap(x => x.p));
  const pool = ids.filter(i => !recent.has(i)); const P = pool.length >= 2 ? pool : ids;
  const minN = Math.min(...P.map(i => R(i).n)); const fresh = P.filter(i => R(i).n === minN);
  const a = fresh[Math.floor(Math.random() * fresh.length)];
  const others = P.filter(i => i !== a).sort((x, y) => Math.abs(R(x).r - R(a).r) - Math.abs(R(y).r - R(a).r) || R(x).n - R(y).n);
  const b = others[Math.floor(Math.random() * Math.min(4, others.length))];
  return Math.random() < .5 ? [a, b] : [b, a];
}
function card(id, side){
  const g = G[id]; const ph = g.photos.length ? g.photos : [];
  return '<div class="card">' + (ph.length ? '<img class="big" id="big' + side + '" src="' + ph[0] + '">' : '<div class="big" style="display:flex;align-items:center;justify-content:center;color:#888">사진 없음</div>') +
    '<div class="thumbs">' + ph.map((p, k) => '<img src="' + p + '" data-s="' + side + '" data-k="' + k + '" class="' + (k ? '' : 'on') + '">').join('') + '</div>' +
    '<div class="nm">' + g.name + '</div><dl>' +
    '<dt>위치</dt><dd>' + g.loc + '</dd><dt>면적</dt><dd>' + g.area + '</dd><dt>구조</dt><dd>' + g.type + '</dd><dt>층</dt><dd>' + (g.floor || '정보 없음') + '</dd><dt>준공</dt><dd>' + (g.built || '정보 없음') + '</dd><dt>입주</dt><dd>' + (g.moveIn || '정보 없음') + '</dd></dl>' +
    '<button class="pickbtn" data-w="' + side + '">이 집이 더 좋아요</button></div>';
}
function showDuel(){
  cur = pickPair();
  document.getElementById('duel').innerHTML = '<div class="duel">' + card(cur[0], 0) + card(cur[1], 1) + '</div><div class="bar"><a id="both">둘 다 별로</a><a id="skip">비슷해서 넘기기</a></div>';
  const seen = ids.filter(i => R(i).n > 0).length;
  document.getElementById('prog').textContent = '고른 횟수 ' + st.log.length + '번, 본 매물 ' + seen + '/' + ids.length;
  window.scrollTo(0, 0);
}
document.getElementById('duel').addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.w != null) { const w = cur[+t.dataset.w], l = cur[1 - t.dataset.w]; elo(w, l, 32); st.log.push({p: [w, l], w, t: Date.now()}); save(); showDuel(); return; }
  if (t.id === 'both') { down(cur[0], 16); down(cur[1], 16); st.log.push({p: cur, w: null, t: Date.now()}); save(); showDuel(); return; }
  if (t.id === 'skip') { showDuel(); return; }
  if (t.dataset.s != null) { const s = t.dataset.s; document.getElementById('big' + s).src = t.src; t.parentNode.querySelectorAll('img').forEach(x => x.classList.remove('on')); t.classList.add('on'); return; }
  if (t.classList.contains('big') && t.src) { document.getElementById('lbi').src = t.src; document.getElementById('lb').classList.add('on'); }
});
document.getElementById('lb').onclick = () => document.getElementById('lb').classList.remove('on');
function showRank(){
  const rows = ids.filter(i => R(i).n > 0).sort((a, b) => R(b).r - R(a).r);
  document.getElementById('rank').innerHTML = rows.length ? '<table><tr><th></th><th>순위</th><th>매물</th><th>비교 횟수</th></tr>' + rows.map((i, k) => '<tr><td>' + (G[i].photos[0] ? '<img src="' + G[i].photos[0] + '">' : '') + '</td><td>' + (k + 1) + '</td><td>' + G[i].name + '<br><span style="color:#555">' + G[i].loc + ', ' + G[i].area + '</span></td><td>' + R(i).n + '</td></tr>').join('') + '</table><p><a id="reset" style="cursor:pointer;text-decoration:underline">처음부터 다시 하기</a></p>' : '<p>아직 고른 게 없어요.</p>';
}
document.getElementById('toRank').onclick = () => { showRank(); document.getElementById('duel').style.display = 'none'; document.querySelector('.how').style.display = 'none'; document.getElementById('rank').style.display = ''; document.getElementById('toRank').style.display = 'none'; document.getElementById('toDuel').style.display = ''; };
document.getElementById('toDuel').onclick = () => { document.getElementById('duel').style.display = ''; document.querySelector('.how').style.display = ''; document.getElementById('rank').style.display = 'none'; document.getElementById('toRank').style.display = ''; document.getElementById('toDuel').style.display = 'none'; showDuel(); };
document.getElementById('rank').addEventListener('click', e => { if (e.target.id === 'reset' && confirm('지금까지 고른 결과를 모두 지울까요?')) { st.r = {}; st.log = []; save(); showRank(); } });
showDuel();
